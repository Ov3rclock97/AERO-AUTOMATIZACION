[project]
name = "netautolab"
version = "0.1.0"
description = "Plataforma modular de automatización de redes."
authors = [
    {name = "Aero Automatizacion", email = "admin@example.com"},
]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.7.1",
    "netmiko>=4.3.0",
    "paramiko>=3.4.0",
    "pyserial>=3.5",
    "python-dotenv>=1.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "scrapli>=2023.7.30",
    "cryptography>=42.0.5",
    "pyyaml>=6.0.1"
]
requires-python = ">=3.12"

[project.scripts]
netauto = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
